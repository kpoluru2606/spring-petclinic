# Azure Cosmos DB for Cassandra configuration
# Uses Service Connector with Managed Identity for authentication
# The variables that start with "AZURE_COSMOS_" are compatible with the ones provided by Azure Service Connector.
# Refs: https://learn.microsoft.com/azure/service-connector/how-to-integrate-cosmos-cassandra?tabs=java

# Database configuration
database=cassandra
spring.data.cassandra.schema-action=none

# Service Connector-provided properties (auto-configured in Azure)
# These properties will be automatically provided by Azure Service Connector when deployed
spring.data.cassandra.contact-points=${AZURE_COSMOS_CONTACTPOINT:localhost}
spring.data.cassandra.port=${AZURE_COSMOS_PORT:10350}
spring.data.cassandra.keyspace-name=${AZURE_COSMOS_KEYSPACE:petclinic}
spring.data.cassandra.local-datacenter=${AZURE_COSMOS_LOCALDATACENTER:datacenter1}
spring.data.cassandra.ssl=${AZURE_COSMOS_SSL:false}
spring.data.cassandra.username=${AZURE_COSMOS_USERNAME:}
spring.data.cassandra.password=${AZURE_COSMOS_PASSWORD:}

# Azure Cosmos DB Service Connector environment variables
# These properties are used for Service Connector integration with Managed Identity
azure.cosmos.listkeyurl=${AZURE_COSMOS_LISTKEYURL:}
azure.cosmos.scope=${AZURE_COSMOS_SCOPE:}
azure.cosmos.resourceendpoint=${AZURE_COSMOS_RESOURCEENDPOINT:}
azure.cosmos.contactpoint=${AZURE_COSMOS_CONTACTPOINT:}
azure.cosmos.port=${AZURE_COSMOS_PORT:}
azure.cosmos.keyspace=${AZURE_COSMOS_KEYSPACE:}
azure.cosmos.username=${AZURE_COSMOS_USERNAME:}
azure.cosmos.clientid=${AZURE_COSMOS_CLIENTID:}
